# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    documents_directory: '%kernel.project_dir%/public/uploads/documents'
    apilocate_api_key: '%env(string:APILOCATE_API_KEY)%'
    fcs_api_key: '%env(string:FCS_API_KEY)%'
    fcs_cache_ttl_seconds: '%env(int:FCS_CACHE_TTL_SECONDS)%'
    gemini_api_key: '%env(default:default_gemini_key:GEMINI_API_KEY)%'
    default_gemini_key: 'not_set'
    twilio_account_sid: '%env(string:TWILIO_ACCOUNT_SID)%'
    twilio_auth_token: '%env(string:TWILIO_AUTH_TOKEN)%'
    twilio_from_number: '%env(string:TWILIO_FROM_NUMBER)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Transfer\CurrencyRateService:
        arguments:
            $fcsApiKey: '%fcs_api_key%'
            $cacheTtlSeconds: '%fcs_cache_ttl_seconds%'

    App\Service\Transfer\GeoLocateService:
        arguments:
            $apiLocateApiKey: '%apilocate_api_key%'

    App\Service\AIService:
        arguments:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\SmsService:
        arguments:
            $accountSid: '%twilio_account_sid%'
            $authToken: '%twilio_auth_token%'
            $fromNumber: '%twilio_from_number%'
