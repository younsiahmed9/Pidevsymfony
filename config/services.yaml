# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    documents_directory: '%kernel.project_dir%/public/uploads/documents'
    apilocate_api_key: '%env(string:APILOCATE_API_KEY)%'
    fcs_api_key: '%env(string:FCS_API_KEY)%'
    fcs_cache_ttl_seconds: '%env(int:FCS_CACHE_TTL_SECONDS)%'
    brevo_api_key: '%env(string:BREVO_API_KEY)%'
    brevo_sender_email: '%env(string:BREVO_SENDER_EMAIL)%'
    brevo_sender_name: '%env(string:BREVO_SENDER_NAME)%'
    scheduled_transfer_engine: '%env(string:SCHEDULED_TRANSFER_ENGINE)%'
    n8n_scheduled_transfer_webhook: '%env(string:N8N_SCHEDULED_TRANSFER_WEBHOOK)%'
    scheduled_transfer_internal_token: '%env(string:SCHEDULED_TRANSFER_INTERNAL_TOKEN)%'
    n8n_scheduled_transfer_timeout: '%env(int:N8N_SCHEDULED_TRANSFER_TIMEOUT)%'
    symfony_base_url: '%env(string:SYMFONY_BASE_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\Transfer\CurrencyRateService:
        arguments:
            $fcsApiKey: '%fcs_api_key%'
            $cacheTtlSeconds: '%fcs_cache_ttl_seconds%'

    App\Service\Transfer\GeoLocateService:
        arguments:
            $apiLocateApiKey: '%apilocate_api_key%'

    App\Service\Transfer\BrevoEmailService:
        arguments:
            $brevoApiKey: '%brevo_api_key%'
            $senderEmail: '%brevo_sender_email%'
            $senderName: '%brevo_sender_name%'

    App\Service\Transfer\ScheduledTransferEngineResolver:
        arguments:
            $configuredEngine: '%scheduled_transfer_engine%'

    App\Service\Transfer\ScheduledTransferEngineConfigManager:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Transfer\N8nScheduledTransferDispatcher:
        arguments:
            $webhookUrl: '%n8n_scheduled_transfer_webhook%'
            $internalToken: '%scheduled_transfer_internal_token%'
            $timeoutSeconds: '%n8n_scheduled_transfer_timeout%'
            $symfonyBaseUrl: '%symfony_base_url%'

    App\Controller\Integration\N8nScheduledTransferController:
        arguments:
            $internalToken: '%scheduled_transfer_internal_token%'
            $symfonyBaseUrl: '%symfony_base_url%'
